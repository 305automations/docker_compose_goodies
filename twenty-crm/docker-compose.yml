services:
  # ---------------------------------------------------------------------------
  # TWENTY CRM SERVER
  # ---------------------------------------------------------------------------
  server:
    image: twentycrm/twenty:v2
    container_name: twenty-server
    volumes:
      - twenty-server-data:/app/packages/twenty-server/.local-storage
    ports:
      - "3000:3000"
    environment:
      # --- Networking & Core URLs ---
      NODE_PORT: 3000 # Primary port the NodeJS runtime binds to
      SERVER_URL: ${SERVER_URL} # Base public-facing URL for the instance (e.g., https://crm.domain.com)

      # --- Database & Cache Routing ---
      # Assembles connection URI using individual fallbacks; references 'db' host within internal network
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-twenty-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      REDIS_URL: ${REDIS_URL:-redis://twenty-redis:6379} # Internal Redis connection string

      # --- App Lifecycle & Control Flag Switches ---
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-false} # Keeps migrations enabled on main server loop to update schemas
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-false} # Allows the core server to schedule recurring cron queues

      # --- Storage Driver Configurations ---
      STORAGE_TYPE: ${STORAGE_TYPE} # local or s3 production driver choice
      STORAGE_S3_REGION: ${STORAGE_S3_REGION} # AWS/S3 target bucket geographic region
      STORAGE_S3_NAME: ${STORAGE_S3_NAME} # Target S3 object container name
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT} # Custom endpoint override (e.g., MinIO or Cloudflare R2 string)

      # --- Cryptographic Security Keys ---
      ENCRYPTION_KEY: ${ENCRYPTION_KEY} # 256-bit hexadecimal key used to encrypt sensitive data records at rest
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY} # Legacy encryption reference utilized during rollouts or key rotations
      APP_SECRET: ${APP_SECRET} # Unique token string deployed to sign session cookies and JWT keys safely

      # --- Google Workspace Integrations (Optional) ---
      # MESSAGING_PROVIDER_GMAIL_ENABLED: ${MESSAGING_PROVIDER_GMAIL_ENABLED}
      # CALENDAR_PROVIDER_GOOGLE_ENABLED: ${CALENDAR_PROVIDER_GOOGLE_ENABLED}
      # AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID}
      # AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET}
      # AUTH_GOOGLE_CALLBACK_URL: ${AUTH_GOOGLE_CALLBACK_URL}
      # AUTH_GOOGLE_APIS_CALLBACK_URL: ${AUTH_GOOGLE_APIS_CALLBACK_URL}

      # --- Microsoft 365 Integrations (Optional) ---
      # CALENDAR_PROVIDER_MICROSOFT_ENABLED: ${CALENDAR_PROVIDER_MICROSOFT_ENABLED}
      # MESSAGING_PROVIDER_MICROSOFT_ENABLED: ${MESSAGING_PROVIDER_MICROSOFT_ENABLED}
      # AUTH_MICROSOFT_ENABLED: ${AUTH_MICROSOFT_ENABLED}
      # AUTH_MICROSOFT_CLIENT_ID: ${AUTH_MICROSOFT_CLIENT_ID}
      # AUTH_MICROSOFT_CLIENT_SECRET: ${AUTH_MICROSOFT_CLIENT_SECRET}
      # AUTH_MICROSOFT_CALLBACK_URL: ${AUTH_MICROSOFT_CALLBACK_URL}
      # AUTH_MICROSOFT_APIS_CALLBACK_URL: ${AUTH_MICROSOFT_APIS_CALLBACK_URL}

      # --- Outbound Production Mail Server (Optional) ---
      # EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-contact@yourdomain.com}
      # EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-"John from YourDomain"}
      # EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      # EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      # EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      # EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      # EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - twenty-network

  # ---------------------------------------------------------------------------
  # BACKGROUND WORKERS
  # ---------------------------------------------------------------------------
  worker:
    image: twentycrm/twenty:v2
    volumes:
      - twenty-server-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    deploy:
      replicas: 20
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-twenty-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://twenty-redis:6379}

      DISABLE_DB_MIGRATIONS: "true" # Scaled workers must never try concurrent database migration updates
      DISABLE_CRON_JOBS_REGISTRATION: "true" # Locks out cron registrations so they run cleanly on server node only

      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET}
    depends_on:
      twenty-db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - twenty-network

  # ---------------------------------------------------------------------------
  # DATABASE BACKEND
  # ---------------------------------------------------------------------------
  twenty-db:
    image: postgres:16-alpine
    container_name: twenty-db
    volumes:
      - twenty-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default} # Initializes target database schema namespace
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres} # Production passphrase for user authentication
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres} # Master database administrator login credential
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-default}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - twenty-network

  # ---------------------------------------------------------------------------
  # CACHE & BROKER BACKEND
  # ---------------------------------------------------------------------------
  twenty-redis:
    image: redis:7-alpine
    container_name: twenty-redis
    command: ["--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - twenty-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - twenty-network

# ---------------------------------------------------------------------------
# GLOBAL INFRASTRUCTURE
# ---------------------------------------------------------------------------
volumes:
  twenty-db-data:
    name: twenty-db-data
  twenty-server-data:
    name: twenty-server-data
  twenty-redis-data:
    name: twenty-redis-data

networks:
  twenty-network:
    name: twenty-network
    driver: bridge